<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WONDERFIELD</title><style>
*{box-sizing:border-box}body{margin:0;background:#07090d;color:#e9e5dc;font:12px/1.45 ui-monospace,monospace;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;inset:0;pointer-events:none;padding:27px}.top{display:flex;justify-content:space-between}.logo{font:bold clamp(28px,5vw,60px)/.9 sans-serif;letter-spacing:-.06em}.logo i{font-style:normal;color:#ffc85c}.sub,.meta{color:#818793;margin-top:8px;letter-spacing:.12em}.meta{text-align:right}.controls{pointer-events:auto;position:absolute;left:27px;bottom:27px;width:min(390px,calc(100vw - 54px));padding:17px;background:#0a0d12db;border:1px solid #343b46;backdrop-filter:blur(12px);border-radius:12px}.control{display:grid;grid-template-columns:90px 1fr 38px;gap:9px;align-items:center;margin:11px 0}.control label{letter-spacing:.12em;font-size:10px}.control b{color:#ffc85c;text-align:right}input{width:100%;accent-color:#ffc85c}.modes{display:flex;gap:6px;margin-top:14px}.modes button{flex:1;border:1px solid #3d4551;background:#111620;color:#aab0bb;padding:8px;cursor:pointer;font:inherit}.modes button.on{color:#111;background:#ffc85c}.shot{position:absolute;right:27px;bottom:27px;text-align:right}.shot b{font-size:22px}.shot span{display:block;color:#8b929e}.reticle{position:absolute;left:50%;top:50%;width:64px;height:64px;transform:translate(-50%,-50%);border:1px solid #ffffff22;border-radius:50%}.reticle:before,.reticle:after{content:'';position:absolute;background:#ffffff33}.reticle:before{width:90px;height:1px;left:-13px;top:31px}.reticle:after{height:90px;width:1px;top:-13px;left:31px}@media(max-width:700px){.shot{display:none}.ui{padding:16px}.controls{left:16px;bottom:16px}.meta{display:none}}
</style></head><body><canvas id="c"></canvas><div class="ui"><div class="top"><div><div class="logo">WONDER<i>FIELD</i></div><div class="sub">GENERATIVE CINEMATOGRAPHY LAB / WF-01</div></div><div class="meta">ARTIST CONTROLLED<br>REAL-TIME SCENE STUDY</div></div><div class="reticle"></div><div class="controls"><div class="control"><label>TENSION</label><input id="tension" type="range" value="58"><b id="tensionV">58</b></div><div class="control"><label>INTIMACY</label><input id="intimacy" type="range" value="40"><b id="intimacyV">40</b></div><div class="control"><label>WONDER</label><input id="wonder" type="range" value="76"><b id="wonderV">76</b></div><div class="control"><label>CADENCE</label><input id="cadence" type="range" value="32"><b id="cadenceV">32</b></div><div class="modes"><button class="on" data-m="dusk">DUSK</button><button data-m="noir">NOIR</button><button data-m="dream">DREAM</button></div></div><div class="shot"><b id="lens">47mm / T2.8</b><span id="desc">compressed distance · amber edge light</span></div></div><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),P={tension:58,intimacy:40,wonder:76,cadence:32};let mode='dusk',stars=[];for(let i=0;i<180;i++)stars.push([Math.random(),Math.random(),Math.random()]);function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();['tension','intimacy','wonder','cadence'].forEach(k=>document.querySelector('#'+k).oninput=e=>{P[k]=+e.target.value;document.querySelector('#'+k+'V').textContent=P[k]});document.querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('button').forEach(q=>q.classList.toggle('on',q===b))});function poly(points,fill){x.beginPath();points.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.closePath();x.fillStyle=fill;x.fill()}function draw(t){let w=innerWidth,h=innerHeight,drift=Math.sin(t*.00015*(1+P.cadence/20))*P.tension*.13;let pal=mode==='noir'?['#090a0d','#29303b','#c5d0dc']:mode==='dream'?['#11102a','#684b83','#ffbfc7']:['#07101b','#9a493a','#ffc461'];let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,pal[0]);g.addColorStop(.62,pal[1]);g.addColorStop(1,'#050608');x.fillStyle=g;x.fillRect(0,0,w,h);x.globalAlpha=.25+P.wonder/160;stars.forEach(s=>{x.fillStyle=pal[2];x.fillRect(s[0]*w+drift*s[2],s[1]*h*.7,1+s[2]*2,1+s[2]*2)});x.globalAlpha=1;let horizon=h*(.56-P.intimacy/500);for(let j=0;j<7;j++){let z=j/7,base=horizon+j*h*.07,amp=(20+P.wonder*.45)*(1-z);poly([[0,base],[w*.15,base-amp],[w*.3,base+amp*.2],[w*.48,base-amp*.7],[w*.65,base+amp*.3],[w*.82,base-amp*.5],[w,base],[w,h],[0,h]],`rgba(${12+j*4},${18+j*3},${23+j*2},${.88})`)}let cx=w*(.5+drift/w),cy=horizon-45-P.intimacy*.6,r=25+P.intimacy*.32;x.fillStyle=pal[2];x.shadowColor=pal[2];x.shadowBlur=30+P.wonder;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.shadowBlur=0;let fg=.1+P.tension/170;poly([[0,h],[0,h*.55],[w*fg,h*.62],[w*.23,h],[0,h]],'#030405');poly([[w,h],[w,h*.48],[w*(1-fg*.85),h*.61],[w*.78,h],[w,h]],'#020304');document.querySelector('#lens').textContent=Math.round(24+P.intimacy*.58)+'mm / T'+(1.4+(100-P.wonder)/32).toFixed(1);document.querySelector('#desc').textContent=P.tension>65?'tight frame · unstable horizon':P.wonder>65?'open scale · luminous atmosphere':'measured distance · soft contrast';requestAnimationFrame(draw)}requestAnimationFrame(draw);</script></body></html>
